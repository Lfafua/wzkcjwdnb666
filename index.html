<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222620">
<meta name="description" content="灰线 1917：七国一战战壕即时战术游戏">
<title>灰线 1917 · 战壕指挥所</title>
<link rel="stylesheet" href="style.css?v=skills1">
<script src="data.js" defer></script>
<script src="terrain.js" defer></script>
<script src="game.js?v=skills1" defer></script>
<script src="abilities.js" defer></script>
</head>
<body>
<main id="shell">
<header class="mast"><div class="brand"><span class="insignia" aria-hidden="true">╬</span><div><h1>灰线 <em>1917</em></h1><span class="subtitle">战壕指挥所</span></div></div><div class="header-actions">
<button id="intelligence" type="button">军械册</button><button id="pause" type="button" disabled>暂停</button><button id="fullscreen" type="button" aria-pressed="false">⛶ 全屏</button>
</div></header>
<section id="setup" aria-label="战役配置">
<div class="setup-art">
<canvas id="preview" width="512" height="192" aria-hidden="true"></canvas>
<div class="setup-title"><span>1914 — 1918</span><h2>越过壕沟</h2><p>集结分队，夺取前沿据点与敌军指挥所。</p></div>
</div>
<div class="setup-columns">
<div><h3>选择参战国</h3><div class="countries" id="nations"></div></div>
<div class="setup-order"><div class="nation-summary" id="nation-summary"></div><label>对手 <select id="opponent"></select></label><label>战场 <select id="battlefield"></select></label><label>AI 难度 <select id="difficulty"><option value="0">训练</option><option value="1" selected>标准</option><option value="2">老兵</option></select></label><button class="primary" id="start" type="button">进入战场</button></div>
</div>
</section>
<section id="battle" hidden aria-label="战场指挥">
<div class="score">
<div class="side ours" id="ours"></div>
<div class="resources"><div><small>补给</small><strong id="supply">0</strong></div><div><small>据点</small><strong id="points">0/3</strong></div><div><small>用时</small><strong id="clock">0:00</strong></div></div>
<div class="side theirs" id="theirs"></div>
</div>
<div class="battle-area">
<div class="mapframe" id="mapframe">
<canvas id="field" width="1024" height="576" aria-label="开放战场。拖框选中部队，或轻触选中。"></canvas>
<div class="map-hud"><span id="mapname"></span><span id="zoom-label">1×</span></div>
<div class="skill-tools"><button id="skills-open" type="button" aria-haspopup="dialog"><span aria-hidden="true">◈</span> 技能轮 <small id="skills-ready"></small></button><button id="artillery-shortcut" type="button" hidden>开炮</button></div>
<div class="aim-banner" id="aim-banner" hidden><span id="aim-text" role="status"></span><button id="aim-cancel" type="button">取消</button></div>
<div class="map-tools"><button id="zoom-in" type="button" aria-label="放大战场">＋</button><button id="zoom-out" type="button" aria-label="缩小战场">−</button><button id="pan" type="button" aria-pressed="false">平移</button></div>
<div class="curtain" id="curtain" hidden><div><h2 id="result-title"></h2><p id="result-copy"></p><div class="result-actions"><button class="primary" id="result-main" type="button">继续作战</button><button id="return-setup" type="button">返回选国</button></div></div></div>
</div>
<aside class="console" aria-label="军令控制台">
<div class="order-panel"><div class="row-title"><h3>分队指令</h3><span id="selection-count">未选中</span></div>
<div class="commands"><button type="button" id="all">全选</button><button type="button" data-order="move" aria-pressed="false">移动</button><button type="button" data-order="hold" aria-pressed="false">固守</button><button type="button" data-order="charge" aria-pressed="true">冲锋</button></div>
<p id="order-hint">点选己方士兵或拖框选中。选中后，点地图下令。</p></div>
<div class="order-panel"><div class="row-title"><h3>增援</h3><span id="doctrine"></span></div><div id="recruit"></div></div>
<div class="order-panel dispatch"><div class="row-title"><h3>战地电报</h3></div><div id="dispatch" role="status"></div></div>
</aside></div>
</section>
<dialog id="skill-wheel" aria-labelledby="skills-title">
<div class="skills-head"><div><h2 id="skills-title">兵种技能轮</h2><p>部署后解锁。每种技能独立冷却 15 秒。</p></div><form method="dialog"><button>关闭</button></form></div>
<div class="skill-wheel" id="skill-slots"><div class="skill-core" aria-hidden="true"><span>◈</span><b>战术指令</b></div></div>
<p id="skill-detail">选技能后，部分指令需要在战场上指定目标。</p>
</dialog>
<dialog id="archive"><div class="dialog-head"><div><h2>战地军械册</h2><p>历史资料与游戏数值分栏显示。</p></div><form method="dialog"><button>关闭</button></form></div><label>查阅国家 <select id="archive-nation"></select></label><div id="archive-content"></div></dialog>
</main>
</body>
</html>
